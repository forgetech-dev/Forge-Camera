name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show toolchain
        run: swift --version

      # No camera, no API key, no network access to a paid endpoint.
      # Hardware and external-service tests are excluded by default and are
      # never enabled here.
      - name: Build
        run: make build

      - name: Test
        run: make test

  boundaries:
    name: Module boundaries
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The compiler enforces most of the module graph; this catches the rest:
      # platform imports in the domain, vendor names outside vendor modules,
      # production code depending on test doubles, and logic branching on the
      # AI's free-text rationale.
      - name: Check boundaries
        run: ./Tools/check-boundaries.sh

      - name: Verify shared agent skills
        run: ./.agents/verify-skills.sh

  lint:
    name: Lint and format
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install swiftformat swiftlint

      - name: Format check
        run: swiftformat --lint .

      - name: Lint
        run: swiftlint --strict

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a credential removed in a later commit is still leaked.
          fetch-depth: 0

      # The gitleaks CLI is MIT licensed (github.com/gitleaks/gitleaks/blob/master/LICENSE)
      # and free for any use, including organizations and commercial use, with no key.
      #
      # The gitleaks-action wrapper is separate: it requires a licence key for
      # organization-owned repos, free for a single repo and paid beyond that. This
      # repo is org-owned, so running the binary directly avoids that dependency
      # entirely — no key, no signup, no per-repo limit.
      #
      # Version and checksum are both pinned: a scanner update should never turn CI
      # red on its own, and a security step must not run an unverified download.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # 'detect' was removed in gitleaks 8.30; 'git' scans history, 'dir' scans the
      # working tree. --redact keeps any finding out of the public build log.
      - name: Scan git history
        run: ./gitleaks git --no-banner --redact --exit-code 1

      - name: Scan working tree
        run: ./gitleaks dir --no-banner --redact --exit-code 1
